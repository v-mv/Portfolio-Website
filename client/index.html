    <meta name="description" content="Portfolio of Mohit Vaidya, a computational physics researcher and scientific programmer working across numerical methods, RF systems, and precision instrumentation." />
    <meta name="theme-color" content="#0c0f10" />
    <script>
      try {
        const savedTheme = localStorage.getItem("mohit-portfolio-theme");
        const requestedTheme = new URLSearchParams(window.location.search).get("theme");
        const activeTheme = requestedTheme === "light" || requestedTheme === "dark" ? requestedTheme : savedTheme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = activeTheme;
        document.documentElement.style.colorScheme = activeTheme;
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
